<div class="form-card">
  <label>Name: <input [(ngModel)]="model.name" /></label>

  <div>
    <label>Description:</label>
    <textarea [(ngModel)]="model.description"></textarea>
  </div>

  <div>
    <label
      >License:
      <select [(ngModel)]="model.license" (change)="onLicenseChange()">
        <option value="">-- choose --</option>
        <option *ngFor="let l of licenses" [value]="l">{{ l }}</option>
      </select>
    </label>
    <div class="rule" *ngIf="ruleText">{{ ruleText }}</div>
  </div>

  <div>
    <h3>Abilities <button class="level" (click)="levelUp()">Level Up</button></h3>
    <div *ngFor="let key of abilityKeys">
      <label>
        {{ key }}:
        <select [(ngModel)]="model.abilities[key]" [disabled]="locked.has(key)">
          <option value="">--</option>
          <option value="d4" [disabled]="isDieDisabled(key, 'd4')">D4</option>
          <option value="d6" [disabled]="isDieDisabled(key, 'd6')">D6</option>
        </select>
        <span *ngIf="locked.has(key)">
          {{ model.abilities[key] === "d6" ? "(Strength)" : "(Weakness)" }}
        </span>
        <button
          class="level-option"
          *ngIf="leveling"
          (click)="upgradeAbility(key)"
          [disabled]="!levelInfo[key]?.allowed"
        >
          +
        </button>
      </label>
      <div *ngIf="leveling">
        Need {{ levelInfo[key]?.needS }} successes and {{ levelInfo[key]?.needF }} failures
      </div>
    </div>
    <button *ngIf="model.license === 'Diviner'" (click)="randomizeDiviner()">
      Roll Strength & Weakness
    </button>
  </div>

  <div class="skills-section">
    <div class="skill-list">
      <h3>Skills</h3>
      <div
        *ngFor="let s of skills"
        (mouseenter)="hoveredSkill = s"
        (mouseleave)="hoveredSkill = null"
      >
        <label>
          <input
            type="checkbox"
            [checked]="model.skills.includes(s.name)"
            [disabled]="isSkillDisabled(s)"
            (change)="toggleSkill(s, $event.target.checked)"
          />
          {{ s.name }} <span class="ability">({{ s.ability }})</span>
        </label>
      </div>
    </div>
    <div class="skill-desc" [class.show]="hoveredSkill">
      <h4 *ngIf="hoveredSkill">{{ hoveredSkill.name }}</h4>
      <p *ngIf="hoveredSkill">{{ hoveredSkill.description }}</p>
    </div>
  </div>

  <div>
    <h3>Interactions</h3>
    <div *ngFor="let i of interactions">
      <label
        ><input
          type="checkbox"
          [checked]="model.interactions.includes(i)"
          [disabled]="isInteractionDisabled(i)"
          [value]="i"
          (change)="toggleInteraction(i, $event.target.checked)"
        />
        {{ i }}</label
      >
    </div>
  </div>

  <button class="save" (click)="save()">Save</button>
</div>

<div *ngIf="created" class="result-card">
  <h2>Saved Character</h2>
  <character-sheet [character]="created"></character-sheet>
  <button class="save" (click)="exportPdf()">Download PDF</button>
</div>
