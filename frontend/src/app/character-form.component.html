<div class="form-card">
  <label>Name: <input [(ngModel)]="model.name" /></label>

  <div>
    <label>Description:</label>
    <textarea [(ngModel)]="model.description"></textarea>
  </div>

  <div>
    <label>License:
      <select [(ngModel)]="model.license" (change)="onLicenseChange()">
        <option value="">-- choose --</option>
        <option *ngFor="let l of licenses" [value]="l">{{l}}</option>
      </select>
    </label>
  </div>

  <div>
    <h3>Abilities</h3>
    <div *ngIf="model.license === 'Diviner'">
      <button (click)="rollDiviner()">Roll Strength/Weakness</button>
    </div>
    <div *ngFor="let key of abilityKeys">
      <label>{{key}}:
        <select [(ngModel)]="model.abilities[key]">
          <option value="">--</option>
          <option *ngFor="let d of diceOptions" [value]="d">{{d}}</option>
        </select>
      </label>
    </div>
  </div>

  <div>
    <h3>Skills</h3>
    <div *ngFor="let s of skills">
      <label><input type="checkbox" [value]="s" (change)="toggleSkill(s, $event.target.checked)"> {{s}}</label>
    </div>
  </div>

  <div>
    <h3>Interactions</h3>
    <div *ngFor="let i of interactions">
      <label><input type="checkbox" [value]="i" (change)="toggleInteraction(i, $event.target.checked)"> {{i}}</label>
    </div>
  </div>

  <button class="save" (click)="save()">Save</button>
  <div *ngIf="lastId">
    <a [href]="exportUrl()" target="_blank">Download Sheet</a>
  </div>
</div>
