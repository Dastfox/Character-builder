<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mappa Mundi Chronicles – Feuille de personnage</title>
    <style>
      /* ----  RESET & GENERAL LAYOUT  -------------------------------------- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #3e7324; /* matches the green background of the sheet */
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 2rem 1rem;
        font-family: "Times New Roman", serif;
      }

      .sheet-wrapper {
        position: relative;
        width: min(
          100%,
          792px
        ); /* half‑resolution of the original PNG for quicker loading */
      }

      .sheet-wrapper img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* ----  FIELD OVERLAYS  ---------------------------------------------- */
      /* All coordinates are expressed in percentages so the layout scales */
      .field {
        position: absolute;
        font-weight: bold;
        pointer-events: none; /* purely decorative placeholders */
        color: #000;
        text-shadow: 1px 1px 2px #ece8c9;
        white-space: nowrap;
      }

      /* Top banner */
      .name {
        left: 12%;
        top: 13%;
        width: 30%;
      }
      .licence {
        left: 10%;
        top: 19.5%;
        width: 30%;
      }

      /* Strength / Weakness line */
      .strength {
        left: 17%;
        top: 46.75%;
        width: 12%;
      }
      .weakness {
        left: 37%;
        top: 46.75%;
        width: 12%;
      }

      /* Training sub‑sections */
      .traversal {
        left: 11.75%;
        top: 56%;
        width: 12%;
      }
      .observation {
        left: 11.75%;
        top: 65.5%;
        width: 12%;
      }
      .deduction {
        left: 11.75%;
        top: 74.25%;
        width: 12%;
      }
      .exploration {
        left: 11.75%;
        top: 84%;
        width: 12%;
      }

      /* Right‑hand skill / interaction boxes */
      .skill {
        left: 60%;
        top: 44%;
        width: 20%;
      }
      .interaction {
        left: 55%;
        top: 76%;
        width: 20%;
      }
    </style>
  </head>
  <body>
    <div class="sheet-wrapper">
      <!-- Background sheet image -->
      <img
        src="../assets/Character Sheet.png"
        alt="Feuille de personnage Magya Mundé Chronicles"
      />

      <!-- Placeholder fields ("XXX") -->
      <span class="field name">XXX</span>
      <span class="field licence">XXX</span>

      <span class="field strength">XXX</span>
      <span class="field weakness">XXX</span>

      <span class="field traversal">DXX</span>
      <span class="field observation">DXX</span>
      <span class="field deduction">XXX</span>
      <span class="field exploration">XXX</span>

      <span class="field skill">
        <ul>
          <li>XXXX</li>
          <li>XXXX</li>
          <li>XXXX</li>
        </ul>
      </span>
      <span class="field interaction">
        <ul>
          <li>XXXX</li>
          <li>XXXX</li>
          <li>XXXX</li>
        </ul>
      </span>
    </div>
  </body>
</html>
